name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: status
    attributes:
      label: Status bar message
      description: The text shown in the bar at the bottom of the window, if any.
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows 11, Windows 10, Ubuntu / Debian, Fedora, openSUSE, Arch, Raspberry Pi OS, Other]
    validations:
      required: true
  - type: input
    id: scanner
    attributes:
      label: Scanner model and connection
      placeholder: e.g. EPSON ET-2850, USB / network
  - type: input
    id: version
    attributes:
      label: Pagloom version
      placeholder: e.g. v1.0.0
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, sample files (without personal data), output of `scanimage -L` on Linux…
