name: Release

# Builds Pagloom and publishes a GitHub Release whenever a version tag (v*) is pushed.
# Usage: create a tag such as v1.1.0 (GitHub Desktop: History → right-click commit → Create Tag, then Push).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build Windows EXE and Linux AppImages
        run: bash build.sh

      - name: Package Windows build
        run: cd dist && zip -9 Pagloom-windows-x64.zip Pagloom.exe

      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {if (f) exit} f' CHANGELOG.md > release-notes.md
          echo "" >> release-notes.md
          echo "Full history: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)" >> release-notes.md
          cat release-notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Pagloom ${{ github.ref_name }} — Scanner & PDF Utility
          body_path: release-notes.md
          files: |
            dist/Pagloom-windows-x64.zip
            dist/Pagloom-x86_64.AppImage
            dist/Pagloom-aarch64.AppImage

      - name: Keep build artifacts (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: pagloom-builds
          path: |
            dist/Pagloom-windows-x64.zip
            dist/Pagloom-x86_64.AppImage
            dist/Pagloom-aarch64.AppImage
